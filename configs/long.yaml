total_timesteps: 300000
evaluation_episodes: 20

physics:
  gravity: 9.81
  cart_mass_kg: 1.0
  pole_mass_kg: 0.1
  pole_com_length_m: 0.5
  max_force_n: 10.0
  cart_viscous_friction_n_per_mps: 0.10
  motor_time_constant_s: 0.05
  dt_s: 0.02
  track_limit_m: 2.4
  angle_limit_deg: 30.0
  max_episode_s: 10.0

sensor_noise:
  enabled: true
  position_noise_std_m: 0.001
  position_bias_std_m: 0.002
  velocity_noise_std_mps: 0.01
  velocity_bias_std_mps: 0.01
  angle_noise_std_deg: 0.25
  angle_bias_std_deg: 1.0
  gyro_noise_std_dps: 0.10
  gyro_bias_std_dps: 0.30

ppo:
  n_envs: 4
  n_steps: 1024
  batch_size: 64
  n_epochs: 10
  gae_lambda: 0.95
  gamma: 0.99
  ent_coef: 0.0
  learning_rate: 0.0003
  clip_range: 0.2
  use_sde: true
  sde_sample_freq: 4
