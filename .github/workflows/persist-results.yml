name: Persist Training Result

on:
  workflow_run:
    workflows: ["Train RL Agent"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  persist:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download training artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p downloaded
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded

      - name: Copy lightweight result files
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          METADATA="$(find downloaded -type f -name metadata.json -print -quit)"
          test -n "$METADATA"
          RESULT_DIR="$(dirname "$METADATA")"
          TARGET="training-results/run-${RUN_NUMBER}"
          mkdir -p "$TARGET"
          cp "$RESULT_DIR/summary.md" "$TARGET/summary.md"
          cp "$RESULT_DIR/metrics.csv" "$TARGET/metrics.csv"
          cp "$RESULT_DIR/metadata.json" "$TARGET/metadata.json"
          cat > "$TARGET/run-info.md" <<EOF
          # Training run ${RUN_NUMBER}

          - conclusion: success
          - workflow run id: ${RUN_ID}
          - source commit: ${SOURCE_SHA}
          - run URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}
          EOF

      - name: Commit result summary
        env:
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-results/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish training result for run #${RUN_NUMBER} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
